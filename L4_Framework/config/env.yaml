# Platform environment for the Broadcom test device.
# Change this file for other platforms; no C++ changes are required.
environment:
  WAYLAND_DISPLAY: "wayland-0"
  WESTEROS_SINK_USE_ESSRMGR: "1"
  GST_ENABLE_SVP: "1"
  GST_VIRTUAL_DISP_WIDTH: "1920"
  GST_VIRTUAL_DISP_HEIGHT: "1080"
  GST_VIRTUAL_SD_DISP_WIDTH: "1920"
  GST_VIRTUAL_SD_DISP_HEIGHT: "1080"
  do_not_change_display: "true"
  SAGEBIN_PATH: "/usr/bin/"
  XDG_RUNTIME_DIR: "/run"
  LD_PRELOAD: "libwayland-client.so.0:libwayland-egl.so.1:libnxclient.so:liboemcrypto_tl.so:libwesteros_gl.so.0.0.0"
  WESTEROS_DRM_CARD: "/dev/dri/card1"
  WESTEROS_GL_GRAPHICS_MAX_SIZE: "1920x1080"
  WESTEROS_GL_MODE: "1920x1080x60"
  WESTEROS_GL_USE_REFRESH_LOCK: "1"
  WESTEROS_GL_FPS: "1"

# Commands run in list order after setting variables and loading libraries.
# Only add trusted commands for this device. A nonzero exit status is fatal.
commands:
  - "westeros --renderer /usr/lib/libwesteros_render_gl.so.0 --framerate 60 --display wayland-0 &"
