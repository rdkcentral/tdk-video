# Runtime configuration for MediaPipelineTests framework
# This file contains all externalized settings for test execution
# No code changes needed - update this file to change test parameters

[platform]
# Platform identifier (logged at startup)
platform=broadcom

[codecs]
# All codec tests are always listed; running one whose URL is empty fails it.
# Use an asset encoded with the named codec; the URL does not force a decoder.
# Video codecs (audio/video pipeline: video + audio flags, video and audio sinks)
h264_url=file:/opt/60SecondTimer_H264.mp4
hevc_url=
av1_url=
vp9_url=
# Audio codecs (audio-only pipeline: audio flags and audio sink only;
# first-frame, video PTS and video frame checks are skipped)
opus_url=
aac_url=
eac3_url=

[elements]
# Playbin flag nicknames, '+'-separated. Audio/video pipelines apply both;
# audio-only pipelines apply playbin_audio_flags alone (required for them).
playbin_video_flags=native-video+video
playbin_audio_flags=native-audio+audio
audio_sink=autoaudiosink
video_sink=westerossink

[thresholds]
# Timeout values in seconds
# PLAYING monitoring duration, including before pausing and after resuming.
play_timeout_seconds=10
pause_timeout_seconds=5
resume_timeout_seconds=5
position_tolerance_ms=900
pause_position_tolerance_ms=100
sink_stall_timeout_ms=2000

[validation]
# Sink metric checks sampled every 100 ms during PLAYING/PAUSED verification.
# Set *_enabled=false to skip a check entirely.
pts_validation_enabled=true
video_frames_validation_enabled=true
audio_frames_validation_enabled=true
# Number of violations allowed per phase; the Nth violation fails the test
# and tears down the pipeline. 1 = strict (fail on first violation).
# Violations: value changed while PAUSED, moved backwards or stalled
# (sink_stall_timeout_ms) while PLAYING, or never advanced while PLAYING.
pts_error_tolerance=3
video_frames_tolerance=3
audio_frames_tolerance=3

[features]
# Temporary diagnostic mode: log bus errors without asserting or stopping playback.
# Set true to restore fail-fast bus error handling.
fail_on_bus_error=false
log_level=info
verification_log_interval_ms=1000
